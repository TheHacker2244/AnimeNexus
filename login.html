<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceder - Anime Nexus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="responsive.css">
</head>
<body>
    <a href="index.html" class="back-arrow">
        <i class="fas fa-arrow-left"></i>
    </a>

    <div class="login-container">
        <div class="login-box" id="loginBox">
            <img src="img/animenexuslogo.jpg" alt="Anime Nexus" class="logo-login">
            
            <!-- Contenedor con posiciones superpuestas para mantener la altura exacta -->
            <div class="auth-container" id="authContainer">
                
                <!-- PANEL 1: INICIAR SESIÓN -->
                <div class="auth-panel login-panel" id="loginPanel">
                    <h2 id="loginTitle">¡Bienvenido!</h2>
                    <p class="subtitulo">Inicia sesión para guardar tu carrito</p>

                    <form id="loginForm">
                        <div class="input-group">
                            <label for="email">Correo electrónico</label>
                            <input type="email" id="email" placeholder="ejemplo@gmail.com" required>
                        </div>
                        <div class="input-group">
                            <label for="password">Contraseña</label>
                            <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
                        </div>
                        <button type="submit" class="submit-btn" id="submitBtn">Iniciar Sesión</button>
                    </form>

                    <p class="toggle-text">
                        <span>¿No tienes cuenta?</span>
                        <a href="javascript:void(0)" class="toggle-mode-link">Regístrate aquí</a>
                    </p>
                </div>

                <!-- PANEL 2: REGISTRARSE (ocupa EXACTAMENTE el mismo espacio que el panel 1) -->
                <div class="auth-panel register-panel" id="registerPanel">
                    <h2 id="registerTitle">Crear Cuenta</h2>
                    <p class="subtitulo">Regístrate para guardar tu carrito</p>

                    <form id="registerForm">
                        <div class="input-group">
                            <label for="email-reg">Correo electrónico</label>
                            <input type="email" id="email-reg" placeholder="ejemplo@gmail.com" required>
                        </div>
                        <div class="input-group">
                            <label for="password-reg">Contraseña</label>
                            <input type="password" id="password-reg" placeholder="Mínimo 6 caracteres" required>
                        </div>
                        <button type="submit" class="submit-btn" id="submitBtnReg">Crear Cuenta</button>
                    </form>

                    <p class="toggle-text">
                        <span>¿Ya tienes cuenta?</span>
                        <a href="javascript:void(0)" class="toggle-mode-link">Inicia sesión aquí</a>
                    </p>
                </div>
                
            </div>

            <!-- Mensaje de alerta -->
            <div id="mensaje" class="mensaje-alerta"></div>
        </div>
    </div>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="login.js"></script>
</body>
</html>
