<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceder - Anime Nexus</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <a href="index.html" class="back-arrow">
        <i class="fas fa-arrow-left"></i>
    </a>

    <div class="login-container">
        <div class="login-box">
            <img src="img/animenexuslogo.jpg" alt="Anime Nexus" class="logo-login">
            <h2>¡Bienvenido, Otaku!</h2>
            <p class="subtitulo">Inicia sesión para guardar tu carrito</p>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@gmail.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
                </div>
                <button type="submit" id="submitBtn">Iniciar Sesión</button>
            </form>

            <p id="toggle-text" style="margin-top: 15px; font-size: 14px;">
                ¿No tienes cuenta? 
                <a href="#" id="toggleMode">Regístrate aquí</a>
            </p>
            <div id="mensaje" class="mensaje-alerta"></div>
        </div>
    </div>

    <!-- FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="login.js"></script>
</body>
</html>
